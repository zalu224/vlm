[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lvnav"
version = "0.1.0"
description = "Context-engineered VLM guidance for low-vision navigation: pipeline, judge and report tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Perception stack. Torch wheels on macOS arm64 include MPS support.
perception = [
    "torch>=2.3",
    "transformers>=4.44",
    "ultralytics>=8.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
lvnav = "lvnav.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lvnav*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Prompt templates and report tables legitimately exceed the line limit.
per-file-ignores = { "lvnav/context/prompts.py" = ["E501"], "lvnav/eval/rubric.py" = ["E501"], "lvnav/eval/metrics.py" = ["E501"], "tests/*" = ["E501"], "lvnav/shelf/correction.py" = ["E501"], "lvnav/shelf/evaluate.py" = ["E501"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
