# Model roster. `backend` selects navbench.backends.<name>; `served` is the id that backend uses.
# status: local (runs here), cloud (needs the named env var), unavailable (documented, not run).
sampling: {temperature: 1.0, top_p: 1.0, max_tokens: 400, image_max_side: 1024}
server: {base_url: "http://localhost:8080/v1"}
models:
  qwen2.5-vl-7b:   {backend: mlx, served: mlx-community/Qwen2.5-VL-7B-Instruct-4bit, status: local, group: ours}
  qwen2.5-vl-3b:   {backend: mlx, served: mlx-community/Qwen2.5-VL-3B-Instruct-4bit, status: local, group: ours}
  qwen3-vl-2b:     {backend: mlx, served: mlx-community/Qwen3-VL-2B-Instruct-4bit, status: local, group: ours}
  internvl3-2b:    {backend: mlx, served: mlx-community/InternVL3-2B-4bit, status: local, group: ours}
  llava-1.6-mistral-7b: {backend: mlx, served: mlx-community/llava-v1.6-mistral-7b-4bit, status: local, group: paper}
  llava-onevision-qwen2-7b: {backend: none, served: llava-hf/llava-onevision-qwen2-7b-ov-hf, status: unavailable, group: paper,
                             note: "no 4-bit MLX build; bf16 (16 GB) does not fit this machine"}
  gpt-4o:          {backend: openai, served: gpt-4o, status: cloud, env: OPENAI_API_KEY, group: paper}
  gpt-4v:          {backend: openai, served: gpt-4-turbo, status: cloud, env: OPENAI_API_KEY, group: paper,
                    note: "gpt-4-vision-preview is retired; gpt-4-turbo is its successor"}
  claude-3.5-sonnet: {backend: anthropic, served: claude-3-5-sonnet-latest, status: cloud, env: ANTHROPIC_API_KEY, group: paper,
                      note: "if retired, the nearest available snapshot is used and named in the report"}
  claude-opus-5:   {backend: anthropic, served: claude-opus-5, status: cloud, env: ANTHROPIC_API_KEY, group: ours}
  gemini-1.5-pro:  {backend: gemini, served: gemini-1.5-pro, status: cloud, env: GEMINI_API_KEY, group: paper,
                    note: "if retired, the nearest available Gemini model is used and named in the report"}
# Navigation outputs are rated in-session by the Claude Code model (no API key): see
# `nav judge-export` / `nav judge-import`. The API judge below is the alternative when a key exists.
judge: {mode: in-session, label: claude-opus-5-in-session,
        api_fallback: {backend: anthropic, served: claude-fable-5-1, env: ANTHROPIC_API_KEY}}
